# CSA agent registry -- the single source of truth for the `csa` command.
#
# Each block maps a short verb (what you type: `csa author 6`) to an agent
# definition file (which keeps its long name). `csa sync` generates the Codex
# skill wrappers, Claude Code slash commands/subagents and the README usage
# snippets from this file, so edit HERE, not in the generated files.
#
# Format (kept deliberately flat so it parses without PyYAML, like PROJECTS.yaml):
#   verb         short name used on the command line
#   file         agent definition, relative to .agents/
#   title        the "Act as the ..." name inside the agent definition
#   group        pipeline (DOCX change pipeline) | analysis (evidence-led content workflow)
#   step         pipeline order (pipeline agents only)
#   arg          name of the positional argument (SECTION, ANALYSIS_SKILL, ...)
#   inputs       comma list; NAME* = required, NAME=value = default
#   local_inputs defaults that replace inputs for local-model launches (CSA_LOCAL=1 or a codex --profile)
#   locks        what the task holds while it runs under `csa fleet`; tasks sharing a lock never
#                overlap. docx = working DOCX, state = assessment-state.yaml, section = section:<N>,
#                analysis = analysis:<ANALYSIS_SKILL>. Missing = "docx, section" (safe default).
#                The evidence matrix and graph store lock themselves (flock), so appends are safe.
#   instruction  last line of the generated prompt
#   skill        native wrapper skill name (existing or generated by `csa sync`)
#   summary      one line for `csa agents` and generated descriptions

agents:
  - verb: author
    file: csa-change-authoring.md
    title: C-S-A-Change-Authoring Agent
    group: pipeline
    tier: frontier
    step: 1
    arg: SECTION
    inputs: SECTION*, AUTHOR_ITEM_LIMIT=6, RUN_SCOPE=next-authoring-batch, EDIT_MODE=evidence
    local_inputs: AUTHOR_ITEM_LIMIT=3
    locks: section
    instruction: Draft change proposals for the requested section using the agent defaults.
    skill: csa-change-authoring-agent
    summary: Step 1 - draft ChangesCSA_*.md for one section from Discovery Data evidence, then apply it as tracked changes (EDIT_MODE=editorial for a concision pass; --no-apply to stop after drafting).

  - verb: apply
    file: current-state-assessment-document.md
    title: Current-State-Assessment-Document Agent
    group: pipeline
    tier: local
    step: 2
    arg: SECTION
    inputs: SECTION*, ITERATION_EDIT_LIMIT=2, RUN_SCOPE=next-batch, EXECUTION_MODE=framework-first
    locks: docx, section
    instruction: Apply the requested section using the agent defaults.
    skill: csa-document-agent
    summary: Step 2 - apply a change file to the working DOCX in bounded, backed-up batches (tracked changes); csa author runs this for you.

  - verb: review
    file: csa-change-review.md
    title: C-S-A-Change-Review Agent
    group: pipeline
    tier: frontier
    step: 3
    arg: SECTION
    inputs: SECTION*, ITERATION_REVIEW_LIMIT=2, RUN_SCOPE=next-batch
    locks: docx, section
    instruction: Review the requested section using the agent defaults.
    skill: csa-change-review-agent
    summary: Step 3 - verify applied edits, comments and DOCX integrity; write the Change Review Report and cleanup sign-off.

  - verb: cleanup
    file: csa-change-cleanup.md
    title: C-S-A-Change-Cleanup Agent
    group: pipeline
    tier: local
    step: 4
    arg: SECTION
    inputs: SECTION*
    locks: docx, section
    instruction: Finalise the signed-off tracked changes for the requested section.
    skill: csa-change-cleanup-agent
    summary: Step 4 - accept the reviewed tracked changes once the review has signed off.

  - verb: ask
    file: csa-orchestrator-agent.md
    title: CSA Orchestrator Agent
    group: analysis
    tier: local
    arg: SECTION
    inputs: SECTION*
    locks: state, section
    instruction: Progress the requested section using the routing table in the agent definition.
    skill: csa-orchestrator-agent
    summary: Coordinator for the evidence-led workflow - picks the smallest agent and skill for the section.

  - verb: evidence
    file: csa-evidence-investigator-agent.md
    title: CSA Evidence Investigator Agent
    group: analysis
    tier: local
    arg: SECTION
    inputs: SECTION*, MODE=EVIDENCE, BRIEF
    locks: section
    instruction: Build or update the evidence set for the requested section.
    skill: csa-evidence-investigator-agent
    summary: Find, extract, classify and reconcile evidence into the evidence matrix.

  - verb: gaps
    file: csa-evidence-investigator-agent.md
    title: CSA Evidence Investigator Agent
    group: analysis
    tier: local
    arg: SECTION
    inputs: SECTION*, MODE=GAP
    locks: section
    instruction: Assess missing, weak, stale or conflicting evidence for the requested section and produce the gap register and questions.
    skill: csa-gap-analysis-agent
    summary: Investigator in GAP mode - gap register and targeted questions.

  - verb: analyse
    file: csa-technical-analyst-agent.md
    title: CSA Technical Analyst Agent
    group: analysis
    tier: frontier
    arg: ANALYSIS_SKILL
    inputs: ANALYSIS_SKILL*, SECTION
    locks: analysis
    instruction: Run the named analysis skill for the requested section and write the structured deliverable.
    skill: csa-technical-analyst-agent
    summary: One analysis skill at a time (infrastructure-analysis, network-connectivity-analysis, ...).

  - verb: write
    file: csa-writer-agent.md
    title: CSA Writer Agent
    group: analysis
    tier: frontier
    arg: SECTION
    inputs: SECTION*, MODE=SECTION, OUTPUT=section-file, BRIEF
    locks: section
    instruction: Draft or revise the requested section from approved evidence. With MODE=move, write the subsection straight from BRIEF (no evidence, Rating left empty).
    skill: csa-writer-agent
    summary: Draft a section file from evidence, then place it in the working DOCX as tracked changes (csa place; --no-apply to stop after drafting).

  - verb: summary
    file: csa-writer-agent.md
    title: CSA Writer Agent
    group: analysis
    tier: frontier
    arg: SECTION
    inputs: SECTION=Executive Summary, MODE=EXECUTIVE_SUMMARY
    locks: state, section
    instruction: Produce the executive summary. Only proceed if the detailed assessment is stable and the reviewer verdict is READY or READY WITH DECLARED GAPS.
    skill: csa-executive-summary-agent
    summary: Writer in EXECUTIVE_SUMMARY mode - only after the detailed sections are reviewed READY.

  - verb: audit-section
    file: csa-audit-agent.md
    title: CSA Audit Agent
    group: analysis
    tier: frontier
    arg: SECTION
    inputs: SECTION=next, AUDIT_DIR=latest
    locks: section
    instruction: Audit the requested unit of the latest document audit (coverage against the section's Must explain questions, claims against evidence, consistency) and write AUDIT_DIR/sections/<slug>.md in the required format.
    skill: csa-audit-agent
    summary: Read-only audit of one section for what it is missing; feeds csa audit --report.

  - verb: qa
    file: csa-quality-reviewer-agent.md
    title: CSA Quality Reviewer Agent
    group: analysis
    tier: frontier
    arg: SECTION
    inputs: SECTION*
    locks: section
    instruction: Review the requested draft or section and give findings and a verdict.
    skill: csa-quality-reviewer-agent
    summary: Content review - traceability, consistency, section fit, readability, concision; READY / NOT READY verdict.
