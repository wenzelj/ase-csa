[project]
name = "csa-evidence-browser"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

